[fmt]
printWidth = 120
tabWidth = 2
semi = false
singleQuote = true
trailingComma = "all"
arrowParens = "always"
ignorePatterns = [
  "src/components/ui/**",
  "src/routeTree.gen.ts",
  "src/lib/__fixtures__/**",
  "dist/**",
  "npm-package/**",
  "start.js",
  "node_modules/**",
  ".tanstack/**",
  "bun.lock",
]
