name: Feature request
description: Suggest an idea for pow/dock.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What do you want to do?
      description: Describe the task or problem, not only the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How should it work?
      description: How you imagine it in pow/dock. Screenshots or examples from other tools help.
  - type: textarea
    id: other
    attributes:
      label: Anything else?
