# Publishes the pow/dock image to ghcr.io/powroom/powdock (amd64 and arm64).
#
# How to release (set "version" in package.json to the same number first, and commit it):
#   git tag v0.1.0 && git push origin v0.1.0
# The checks run before the build. If one fails, nothing is published.

name: Publish image

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install and run the checks
        run: |
          bun install --frozen-lockfile
          bun check
          bun run lint
          bun test
          bun fmt --check

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          # zstd at the highest level, also for the base image layers: a smaller download than gzip.
          # Pulling it needs Docker 23 or newer (or containerd 1.5+, Podman 4+).
          outputs: type=registry,compression=zstd,compression-level=22,force-compression=true,oci-mediatypes=true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Creates the GitHub Release for the tag, with notes generated from the merged pull requests and commits.
  # The app checks this release for updates. A release that already exists is left as it is.
  release:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists. Nothing to do."
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "pow/dock ${GITHUB_REF_NAME#v}"
          fi
